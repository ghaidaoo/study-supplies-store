<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SVG_START:ANIMATION_9 class="fixed inset-0 w-full h-full" --><div class="fixed inset-0 w-full h-full" id="animated-svg-ANIMATION_9" style="display:block;"><svg viewbox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
<!-- Background: Open Notebook -->
<rect fill="#fdfcf8" height="500" rx="20" stroke="#dcdad3" stroke-width="2" width="700" x="50" y="50"></rect>
<line stroke="#dcdad3" stroke-dasharray="5 5" stroke-width="1" x1="400" x2="400" y1="50" y2="550"></line>
<!-- Writing Lines -->
<g stroke="#e5e7eb" stroke-width="1">
<line x1="100" x2="350" y1="120" y2="120"></line>
<line x1="100" x2="350" y1="160" y2="160"></line>
<line x1="100" x2="350" y1="200" y2="200"></line>
<line x1="450" x2="700" y1="120" y2="120"></line>
<line x1="450" x2="700" y1="160" y2="160"></line>
<line x1="450" x2="700" y1="200" y2="200"></line>
</g>
<!-- Animated Path (Writing) -->
<path d="M100,120 C120,110 140,130 160,120 S200,110 220,120 S260,130 280,120 S320,110 340,120" fill="none" id="writing-path" stroke="#2d3436" stroke-linecap="round" stroke-width="3">
<animate attributename="stroke-dasharray" dur="4s" from="0, 500" repeatcount="indefinite" to="500, 0"></animate>
</path>
<!-- Fountain Pen -->
<g id="pen">
<path d="M0,0 L10,30 L-10,30 Z" fill="#2d3436"></path> <!-- Nib -->
<rect fill="#b8d8ba" height="150" rx="4" width="16" x="-8" y="30"></rect> <!-- Pen Body -->
<animatemotion dur="4s" repeatcount="indefinite" rotate="auto">
<mpath href="#writing-path"></mpath>
</animatemotion>
</g>
</svg></div><!-- STITCH_SVG_END:ANIMATION_9 -->
</body>
</html>
