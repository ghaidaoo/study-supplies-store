<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

ntFamily:{"body-lg":["Inter"],"headline-lg-mobile":["Inter"],"headline-lg":["Inter"],"label-md":["Inter"],"label-sm":["Inter"],"display":["Inter"],"body-md":["Inter"],"headline-md":["Inter"]},fontSize:{"body-lg":["18px",{lineHeight:"1.6",fontWeight:"400"}],"headline-lg-mobile":["24px",{lineHeight:"1.3",fontWeight:"600"}],"headline-lg":["32px",{lineHeight:"1.3",letterSpacing:"-0.01em",fontWeight:"600"}],"label-md":["14px",{lineHeight:"1.2",letterSpacing:"0.01em",fontWeight:"500"}],"label-sm":["12px",{lineHeight:"1.2",fontWeight:"600"}],display:["48px",{lineHeight:"1.2",letterSpacing:"-0.02em",fontWeight:"600"}],"body-md":["16px",{lineHeight:"1.6",fontWeight:"400"}],"headline-md":["24px",{lineHeight:"1.4",fontWeight:"500"}]}}}};</script></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased"><main class="w-full min-h-screen flex items-center justify-center p-margin-mobile lg:p-margin-desktop bg-surface"><div class="flex flex-col w-full items-center justify-center py-6 px-4 sm:px-6">
<!-- Brand Seal & Ambient Header -->
<div class="flex flex-col items-center mb-8 text-center">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary mb-3 shadow-sm">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">spa</span>
</div>
<span class="font-label-sm text-label-sm uppercase tracking-widest text-secondary">StudySpace</span>
</div>
<!-- Main Calm Commerce Authentication Card -->
<div class="w-full max-w-[500px] bg-surface-container-lowest rounded-xl p-6 sm:p-10 shadow-sm relative overflow-hidden">
<!-- Subtle top ambient accent bar -->
<div class="absolute top-0 inset-x-0 h-1 bg-gradient-to-r from-primary-fixed via-primary to-primary-fixed opacity-70"></div>
<!-- Segmented Mode Switcher -->
<div class="w-full p-1 bg-surface-container-low rounded-lg flex items-center mb-8">
<button class="flex-1 py-2 rounded font-label-md text-label-md transition-all duration-200 text-secondary hover:text-on-surface" id="tab-signin" onclick="switchAuthTab('signin')" type="button">
        Sign In
      </button>
<button class="flex-1 py-2 rounded font-label-md text-label-md transition-all duration-200 bg-surface text-on-surface shadow-sm font-semibold" id="tab-signup" onclick="switchAuthTab('signup')" type="button">
        Create Account
      </button>
</div>
<!-- Header Copy -->
<div class="mb-8">
<h1 class="font-headline-md text-headline-md text-on-surface mb-2 font-medium tracking-tight">
        Begin your mindful workspace
      </h1>
<p class="font-body-md text-body-md text-secondary">
        Join a community dedicated to calm and intentional craft.
      </p>
</div>
<!-- Registration Form -->
<form class="space-y-5" onsubmit="event.preventDefault();">
<!-- Full Name -->
<div class="space-y-1.5">
<label class="block font-label-md text-label-md text-on-surface" for="name">
          Full Name
        </label>
<div class="relative">
<input class="w-full bg-surface-container-low text-on-surface placeholder:text-outline-variant font-body-md text-body-md px-4 py-3 rounded-lg outline-none focus:bg-surface focus:shadow-sm focus:ring-1 focus:ring-primary transition-all duration-150" id="name" name="name" placeholder="Alex Vance" required="" type="text"/>
<div class="absolute right-3.5 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
</div>
</div>
<!-- Email Address -->
<div class="space-y-1.5">
<label class="block font-label-md text-label-md text-on-surface" for="email">
          Email address
        </label>
<div class="relative">
<input class="w-full bg-surface-container-low text-on-surface placeholder:text-outline-variant font-body-md text-body-md px-4 py-3 rounded-lg outline-none focus:bg-surface focus:shadow-sm focus:ring-1 focus:ring-primary transition-all duration-150" id="email" name="email" placeholder="alex@workspace.io" required="" type="email"/>
<div class="absolute right-3.5 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">
<span class="material-symbols-outlined text-[20px]">alternate_email</span>
</div>
</div>
</div>
<!-- Password with Live Indicator -->
<div class="space-y-1.5">
<div class="flex items-center justify-between">
<label class="block font-label-md text-label-md text-on-surface" for="password">
            Password
          </label>
<span class="font-label-sm text-label-sm text-secondary" id="password-hint">
            8+ chars, mix letters & numbers
          </span>
</div>
<div class="relative">
<input class="w-full bg-surface-container-low text-on-surface placeholder:text-outline-variant font-body-md text-body-md px-4 py-3 pr-11 rounded-lg outline-none focus:bg-surface focus:shadow-sm focus:ring-1 focus:ring-primary transition-all duration-150" id="password" name="password" oninput="evaluatePasswordStrength(this.value)" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-outline hover:text-on-surface rounded transition-colors" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px] block" id="pw-visibility-icon">visibility</span>
</button>
</div>
<!-- Subtle Strength Meter -->
<div class="pt-1 flex gap-1.5 items-center">
<div class="h-1 flex-1 rounded-full bg-surface-container-high transition-colors duration-300" id="meter-bar-1"></div>
<div class="h-1 flex-1 rounded-full bg-surface-container-high transition-colors duration-300" id="meter-bar-2"></div>
<div class="h-1 flex-1 rounded-full bg-surface-container-high transition-colors duration-300" id="meter-bar-3"></div>
</div>
</div>
<!-- Checkboxes -->
<div class="pt-2 space-y-3">
<!-- Terms checkbox -->
<label class="flex items-start gap-3 cursor-pointer group select-none">
<div class="relative flex items-center justify-center mt-0.5">
<input class="peer sr-only" id="terms" name="terms" required="" type="checkbox"/>
<div class="w-4 h-4 rounded bg-surface-container-high peer-checked:bg-primary transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[14px] text-on-primary opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
</div>
<span class="font-body-md text-body-md text-secondary leading-snug">
            I agree to the <a class="text-on-surface underline hover:text-primary transition-colors" href="#">Terms of Service</a> and <a class="text-on-surface underline hover:text-primary transition-colors" href="#">Privacy Policy</a>
</span>
</label>
<!-- Newsletter checkbox -->
<label class="flex items-start gap-3 cursor-pointer group select-none">
<div class="relative flex items-center justify-center mt-0.5">
<input checked="" class="peer sr-only" id="newsletter" name="newsletter" type="checkbox"/>
<div class="w-4 h-4 rounded bg-surface-container-high peer-checked:bg-primary transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[14px] text-on-primary opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
</div>
<span class="font-body-md text-body-md text-secondary leading-snug">
            Receive thoughtful notes on workspace curation
          </span>
</label>
</div>
<!-- Primary CTA: Solid Muted Sage Green Button -->
<div class="pt-3">
<button class="w-full bg-primary hover:bg-on-primary-container active:scale-[0.99] text-on-primary font-label-md text-label-md py-3.5 px-6 rounded-lg shadow-sm transition-all duration-200 flex items-center justify-center gap-2" type="submit">
<span>Create Account</span>
<span class="material-symbols-outlined text-[18px]">east</span>
</button>
</div>
</form>
<!-- Calm Divider -->
<div class="relative my-7 flex items-center justify-center">
<div class="w-full h-px bg-surface-container-highest"></div>
<span class="absolute px-4 bg-surface-container-lowest font-label-sm text-label-sm text-secondary">
        or sign up with
      </span>
</div>
<!-- Secondary Social SSO: Google -->
<button class="w-full bg-surface-container-lowest hover:bg-surface-container-low active:scale-[0.99] text-on-surface font-label-md text-label-md py-3 px-4 rounded-lg shadow-sm transition-all duration-150 flex items-center justify-center gap-3" type="button">
<svg aria-hidden="true" class="w-4 h-4" viewbox="0 0 24 24">
<path d="M12 5c1.54 0 2.92.53 4.02 1.57l3.01-3.01C17.21 1.83 14.8 1 12 1 7.37 1 3.42 3.66 1.5 7.51l3.66 2.84C6.03 7.34 8.76 5 12 5z" fill="#EA4335"></path>
<path d="M23.49 12.27c0-.82-.07-1.61-.21-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58l3.69 2.86c2.16-1.99 3.73-4.92 3.73-8.68z" fill="#4285F4"></path>
<path d="M5.16 14.65c-.24-.72-.38-1.49-.38-2.28 0-.79.14-1.56.38-2.28L1.5 7.51C.55 9.4 0 11.53 0 12.72c0 2.37.55 4.64 1.5 6.53l3.66-2.6z" fill="#FBBC05"></path>
<path d="M12 23c3.24 0 5.95-1.07 7.93-2.91l-3.69-2.86c-1.07.72-2.45 1.15-4.24 1.15-3.24 0-5.97-2.34-6.84-5.35L1.5 15.87C3.42 19.72 7.37 23 12 23z" fill="#34A853"></path>
</svg>
<span>Continue with Google</span>
</button>
<!-- Footnote Prompt -->
<div class="mt-8 text-center pt-2">
<p class="font-body-md text-body-md text-secondary">
        Already have an account? 
        <button class="text-on-surface font-label-md text-label-md underline hover:text-primary transition-colors ml-1" onclick="switchAuthTab('signin')" type="button">
          Sign In
        </button>
</p>
</div>
</div>
<!-- Soft Workspace Inspiration Accent Below -->
<div class="mt-8 flex items-center gap-6 text-secondary font-label-sm text-label-sm">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[16px] text-primary">eco</span>
<span>Sustainably Sourced</span>
</div>
<div class="w-1 h-1 rounded-full bg-outline-variant"></div>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[16px] text-primary">verified</span>
<span>Curated Tools</span>
</div>
<div class="w-1 h-1 rounded-full bg-outline-variant"></div>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[16px] text-primary">lock</span>
<span>Encrypted Privacy</span>
</div>
</div>
</div>
<script>
  function switchAuthTab(mode) {
    const tabSignIn = document.getElementById('tab-signin');
    const tabSignUp = document.getElementById('tab-signup');
    
    if (mode === 'signin') {
      tabSignIn.classList.add('bg-surface', 'text-on-surface', 'shadow-sm', 'font-semibold');
      tabSignIn.classList.remove('text-secondary');
      
      tabSignUp.classList.remove('bg-surface', 'text-on-surface', 'shadow-sm', 'font-semibold');
      tabSignUp.classList.add('text-secondary');
    } else {
      tabSignUp.classList.add('bg-surface', 'text-on-surface', 'shadow-sm', 'font-semibold');
      tabSignUp.classList.remove('text-secondary');
      
      tabSignIn.classList.remove('bg-surface', 'text-on-surface', 'shadow-sm', 'font-semibold');
      tabSignIn.classList.add('text-secondary');
    }
  }

  function togglePasswordVisibility() {
    const pwInput = document.getElementById('password');
    const icon = document.getElementById('pw-visibility-icon');
    if (pwInput.type === 'password') {
      pwInput.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      pwInput.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function evaluatePasswordStrength(val) {
    const b1 = document.getElementById('meter-bar-1');
    const b2 = document.getElementById('meter-bar-2');
    const b3 = document.getElementById('meter-bar-3');
    const hint = document.getElementById('password-hint');

    // Reset base colors
    b1.className = 'h-1 flex-1 rounded-full bg-surface-container-high transition-colors duration-300';
    b2.className = 'h-1 flex-1 rounded-full bg-surface-container-high transition-colors duration-300';
    b3.className = 'h-1 flex-1 rounded-full bg-surface-container-high transition-colors duration-300';

    if (!val || val.length === 0) {
      hint.textContent = '8+ chars, mix letters & numbers';
      hint.className = 'font-label-sm text-label-sm text-secondary';
      return;
    }

    const hasLetters = /[a-zA-Z]/.test(val);
    const hasNumbers = /\d/.test(val);
    const isLongEnough = val.length >= 8;

    if (val.length < 5) {
      b1.classList.remove('bg-surface-container-high');
      b1.classList.add('bg-error');
      hint.textContent = 'Too short';
      hint.className = 'font-label-sm text-label-sm text-error';
    } else if (isLongEnough && hasLetters && hasNumbers) {
      b1.classList.remove('bg-surface-container-high');
      b2.classList.remove('bg-surface-container-high');
      b3.classList.remove('bg-surface-container-high');
      b1.classList.add('bg-primary');
      b2.classList.add('bg-primary');
      b3.classList.add('bg-primary');
      hint.textContent = 'Thoughtful & secure';
      hint.className = 'font-label-sm text-label-sm text-primary';
    } else {
      b1.classList.remove('bg-surface-container-high');
      b2.classList.remove('bg-surface-container-high');
      b1.classList.add('bg-primary-container');
      b2.classList.add('bg-primary-container');
      hint.textContent = 'Getting stronger';
      hint.className = 'font-label-sm text-label-sm text-on-surface-variant';
    }
  }
</script></main></body></html>
